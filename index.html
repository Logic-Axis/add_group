<!DOCTYPE html>
<html lang="ja">
<head>
<!----------------------------------------------------------------->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#a9ceec" />

  <title>グループツール</title>
  <meta name="description" content="" />

  <link rel="icon" href="" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="つっくん帝国" />
  <meta property="og:title"       content="グループツール" />
  <meta property="og:description" content="" />
  <meta property="og:url"         content="" />
  <meta property="og:image"       content="" />
<!----------------------------------------------------------------->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #202225; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #5865f2; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #7289da; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg,#2f3136,#1e1f22);
      color:#fff;
      margin:0; padding:0;
      display:flex; justify-content:center; align-items:center;
      height:100vh;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -moz-user-select: none;
    }
    .card {
      background:#36393f;
      padding:32px;
      border-radius:20px;
      box-shadow:0 15px 35px rgba(0,0,0,.5);
      width:100%; max-width:600px;
      animation:fadeIn .8s ease;
      overflow-y:auto; /* 横スクロールバーを消すためoverflow-xはhidden */
      overflow-x:hidden;
      max-height:95vh;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    h2 { color:#adb8ff; text-align:center; margin:0 0 24px; font-weight:600; }
    label { display:block; margin-top:18px; font-size:14px; }
    input[type="text"], input[type="password"], textarea {
      width:100%; padding:10px; margin-top:6px;
      border-radius:8px; border:none;
      background:#202225; color:#fff;
      font-family:monospace; resize:vertical;
    }
    textarea { overflow-y:auto; }
    input[type="number"] {
      padding:6px; margin-top:6px;
      border-radius:8px; border:none;
      background:#202225; color:#fff;
      font-family:monospace; appearance:none;
      width:80px;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance:none; margin:0;
    }
    .row {
      display:flex; gap:12px; align-items:center;
    }
    .row > * { flex:none; }
    .row label,
    .row .checkbox-container { margin-top:0; }
    .checkbox-container {
      display:flex; align-items:center; gap:8px;
      cursor:pointer; font-size:14px; user-select:none;
      margin-top:6px;
    }
    .checkbox-container input {
      appearance:none; width:36px; height:18px;
      background:#4f545c; border-radius:18px;
      position:relative; transition:background .3s ease;
    }
    .checkbox-container:hover input { background:#5a5f68; }
    .checkbox-container input:focus {
      outline:none; box-shadow:0 0 0 3px rgba(114,137,218,0.5);
    }
    .checkbox-container input::before {
      content:''; position:absolute;
      width:14px; height:14px; border-radius:50%;
      background:#fff; top:2px; left:2px;
      transition:transform .3s cubic-bezier(.68,-.55,.27,1.55);
    }
    .checkbox-container input:checked { background:#7289da; }
    .checkbox-container input:checked::before {
      transform:translateX(18px);
    }
    .checkbox-container span { transition:color .3s; }
    .checkbox-container input:checked + span {
      color:#adb8ff;
    }
    button.primary, button.secondary {
      margin-top:12px; width:auto; min-width:140px; padding:7px 14px;
      border:none; border-radius:10px;
      font-weight:600; font-size:14px;
      letter-spacing:.2px; cursor:pointer; position:relative;
      overflow:hidden; transition:all .2s;
    }
    button.primary {
      background:linear-gradient(135deg,#6d75ff,#5865f2);
      color:#fff;
      box-shadow:0 2px 8px rgba(88,101,242,.25),0 0 4px rgba(255,255,255,.08),inset 0 0 2px rgba(255,255,255,.12);
    }
    button.secondary {
      background:linear-gradient(135deg,#e74c3c,#c0392b);
      color:#fff;
      box-shadow:0 2px 8px rgba(236,81,81,.25),0 0 4px rgba(255,255,255,.08),inset 0 0 2px rgba(255,255,255,.12);
    }
    button.disabled-btn {
      background: #ccc !important;
      color: #fff !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
    }
    .button-container {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .message-field {
      position: relative;
      margin-top: 18px;
    }
    .message-field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .message-field-header label {
      margin: 0;
    }
    .settings-button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #555b66;
      border-radius: 7px;
      background: #202225;
      color: #d7d9dc;
      cursor: pointer;
    }
    .settings-button:hover,
    .settings-button[aria-expanded="true"] {
      border-color: #8b95ff;
      color: #adb8ff;
    }
    .settings-button svg {
      width: 18px;
      height: 18px;
    }
    .message-settings-panel {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #4b5260;
      border-left: 3px solid #7289da;
      border-radius: 8px;
      background: #292b30;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .24);
    }
    .message-settings-panel[hidden] {
      display: none;
    }
    .message-settings-title {
      margin: 0 0 10px;
      color: #adb8ff;
      font-size: 13px;
      font-weight: 600;
    }
    .message-settings-panel .checkbox-container {
      margin-top: 8px;
    }
  .file-input-wrapper {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }
  .icon-upload-controls {
    min-width: 0;
  }
  .file-label {
    display: inline-block;
    padding: 10px 16px;
    background-color: #6d75ff;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.2s ease;
    white-space: nowrap;
  }
  .file-label:hover {
    background-color: #5865f2;
  }
  .file-name {
    display: block;
    min-width: 0;
    margin: 8px 0 0;
    font-size: 13px;
    color: #aaa;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .icon-preview-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-preview-placeholder,
  #iconPreview {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 50%;
  }
  .icon-preview-placeholder {
    display: grid;
    place-items: center;
    border: 1px dashed #737985;
    background: #292c32;
    color: #aeb4bf;
  }
  .icon-preview-placeholder svg {
    width: 24px;
    height: 24px;
  }
  #iconPreview {
    display: none;
    object-fit: cover;
  }
  .icon-preview-remove {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid #6a4548;
    border-radius: 50%;
    background: #38292b;
    color: #f0b5b5;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .icon-preview-remove:hover {
    background: #563235;
    color: #fff;
  }
  input[type="file"] {
    display: none;
  }
    #logArea { margin-top:20px; padding:10px; height:120px; overflow-y:auto; background:#202225; border-radius:10px; font-family:monospace; font-size:12px; white-space:pre-wrap; resize: vertical;}
    @media (max-width: 600px) {
      .card {
        padding: 16px;
        max-width: 95%;
        border-radius: 10px;
      }
      h2 {
        font-size: 18px;
        margin-bottom: 16px;
      }
      label {
        font-size: 13px;
        margin-top: 12px;
      }
      input[type="text"],
      input[type="password"],
      textarea {
        padding: 8px;
        font-size: 12px;
      }
      textarea {
        height: auto;
        min-height: 60px;
      }
      button.primary,
      button.secondary {
        padding: 10px;
        font-size: 16px;
        width: 100%;
        margin-top: 12px;
      }
      .button-container {
        flex-direction: column;
        gap: 8px;
      }
      .checkbox-container {
        font-size: 13px;
        flex-direction: row;
      }
      .file-input-wrapper { gap: 10px; }
      .file-label { padding: 8px 10px; font-size: 12px; }
      .file-name {
        font-size: 12px;
      }
      .icon-preview-box { gap: 6px; }
      .icon-preview-placeholder,
      #iconPreview { width: 56px; height: 56px; }
      #logArea {
        height: 80px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>グループツール</h2>
    <label for="token">TOKEN</label>
    <div style="position:relative;">
      <input type="password" id="token" placeholder="TOKENを入力" style="width:100%;padding-right:36px;">
      <button type="button" id="toggleTokenBtn" aria-label="マスク切替" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; padding:0; margin:0; cursor:pointer; width:24px; height:24px; display:flex; align-items:center; justify-content:center; opacity:0.7;">
        <span id="tokenMaskIcon">
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/></svg>
        </span>
      </button>
    </div>
    <label for="userIds">ユーザーID（改行区切り）</label>
    <textarea id="userIds" placeholder="例：123456789012345678"></textarea>
    <label for="groupNames">グループ名（改行区切り）</label>
    <textarea id="groupNames" placeholder="例：Group A"></textarea>
    <label for="iconImage">グループアイコン画像</label>
    <div class="file-input-wrapper">
      <div class="icon-upload-controls">
        <label class="file-label">
          ファイルを選択
          <input type="file" id="iconImage" accept="image/*">
        </label>
        <span class="file-name" id="iconFileName">画像未選択</span>
      </div>
      <div id="iconPreviewBox" class="icon-preview-box">
        <div id="iconPreviewPlaceholder" class="icon-preview-placeholder" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <img id="iconPreview" alt="グループアイコンのプレビュー">
        <button type="button" class="icon-preview-remove" id="clearIconBtn" aria-label="アイコンを削除" title="アイコンを削除" style="display:none;">×</button>
      </div>
    </div>
    <div class="row" style="margin-top:18px;">
      <button type="button" class="primary" id="createGroupBtn">作成開始</button>
    </div>
    <div class="row" style="margin-top:18px;">
      <button type="button" class="primary" id="addGroupBtn">グループ追加開始</button>
    </div>
    <div class="message-field">
      <div class="message-field-header">
        <label for="sendMessage">送信メッセージ</label>
        <button type="button" class="settings-button" id="messageSettingsBtn" aria-label="メッセージ送信設定" aria-expanded="false" aria-controls="messageSettingsPanel" title="メッセージ送信設定">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="message-settings-panel" id="messageSettingsPanel" hidden>
        <p class="message-settings-title">メッセージ送信設定</p>
        <label class="checkbox-container">
          <input type="checkbox" id="sendOnCreateToggle">
          <span>グループ作成時に送信</span>
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="sendOnAddToggle">
          <span>グループ追加時に送信</span>
        </label>
      </div>
      <textarea id="sendMessage" placeholder="全DMグループに送るメッセージを入力"></textarea>
    </div>
    <!-- メッセージ一括送信ボタンと停止ボタン削除 -->
    <div id="rateLimitBox" style="margin-top:10px;">
      <div id="rateLimitCreation"></div>
      <div id="rateLimitAddition"></div>
    </div>
    <div id="logArea" style="margin-top:20px;">ログがここに表示されます</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
